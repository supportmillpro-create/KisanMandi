# Builds an installable Android app (APK) that opens the KisanMandi server,
# and also saves the web files (dist) for uploading to the server.
# Run it: GitHub repo -> Actions -> "Build APK" -> Run workflow. Download from the "Artifacts" box.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: KisanMandi-web-dist
          path: dist
      - run: npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - run: npx cap add android
      - name: App icon and location permission
        run: |
          IM=$(command -v magick || command -v convert)
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; sz=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              $IM public/logo.png -resize ${sz}x${sz} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' $M
          grep -n "permission" $M
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: KisanMandi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
